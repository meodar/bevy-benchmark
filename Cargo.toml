[package]
name = "top_former"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", features = ["jpeg", "png"] }
sysinfo = "0.39.6"
nvml-wrapper = "0.13.0"
chrono = "0.4.45"

[features]
default = []
fps_debug = []
lldb_debug = []

[profile.release]
opt-level = 3          # максимальный уровень оптимизаций
debug = false          # без отладочной информации
lto = true             # Link-Time Optimization — дополнительно оптимизирует на этапе линковки
codegen-units = 1      # один «юнит» компоновки, чтобы LLVM мог лучше оптимизировать код целиком
panic = "abort"        # вместо unwinding использовать abort — уменьшает размер кода
strip = "debuginfo"    # удалить отладочную информацию из собранного артефакта
incremental = false    # отключить инкрементальную компиляцию для чистоты релиза